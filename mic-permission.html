<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone Permission - Vision Agent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
        }
        p {
            color: #b3b3b3;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .button {
            background: #4f9eff;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .button:hover {
            background: #6fb1ff;
        }
        .status {
            margin-top: 24px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid #34d399;
            color: #34d399;
            display: block;
        }
        .status.error {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid #f87171;
            color: #f87171;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Microphone Permission</h1>
        <p>
            To use voice input, Vision Agent needs microphone access.
            Click the button below to request permission.
        </p>
        <button class="button" id="requestBtn">Request Microphone Access</button>
        <div id="status" class="status"></div>
        <p style="margin-top: 32px; font-size: 14px;">
            If permission is denied, you can also grant it manually:<br>
            <strong>chrome://settings/content/microphone</strong>
        </p>
    </div>
    <script>
        const requestBtn = document.getElementById('requestBtn');
        const status = document.getElementById('status');
        
        requestBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                status.textContent = '✅ Microphone permission granted! You can now use voice input.';
                status.className = 'status success';
                stream.getTracks().forEach(track => track.stop());
                requestBtn.disabled = true;
                requestBtn.textContent = 'Permission Granted';
            } catch (error) {
                status.textContent = '❌ Permission denied. Please check Chrome settings or try again.';
                status.className = 'status error';
                console.error('Permission error:', error);
            }
        });
    </script>
</body>
</html>
